version: 1.0.{build}
image: Visual Studio 2022
install:
  - ps: |
      $ErrorActionPreference = 'Stop'
      Invoke-WebRequest -Uri 'https://dot.net/v1/dotnet-install.ps1' -OutFile "$env:temp\dotnet-install.ps1"
      & powershell.exe -NoProfile -ExecutionPolicy Bypass -File "$env:temp\dotnet-install.ps1" -Channel 10.0 -InstallDir "$env:ProgramFiles\dotnet"
      if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
configuration: Release
build_script:
  - dotnet build MIG.Audio.sln -c Release
test_script:
  - dotnet test MIG.Audio.Tests/MIG.Audio.Tests.csproj -c Release --no-build
  - dotnet run --project Test.WebService -c Release --no-build -- --port=18088 --self-test
after_test:
  - ps: |
      $ErrorActionPreference = 'Stop'
      if ($env:APPVEYOR_REPO_TAG -eq "true") {
        $pkgVersion = $env:APPVEYOR_REPO_TAG_NAME -replace '^v', ''
        if ($pkgVersion -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$') {
          throw "Expected a release tag such as v1.0.0 or v1.0.0-preview.1"
        }
      } else {
        $pkgVersion = "1.0.0-preview.build.$env:APPVEYOR_BUILD_NUMBER"
      }
      dotnet pack MIG.Audio/MIG.Audio.csproj -c Release --output artifacts /p:PackageVersion=$pkgVersion
      if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
artifacts:
  - path: 'artifacts\*.nupkg'
    name: NuGet Package
  - path: 'artifacts\*.snupkg'
    name: Symbols Package
deploy: off
